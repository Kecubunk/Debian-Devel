# Lokasi dan Bahasa
d-i debian-installer/locale string id_ID.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Jaringan
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string carbon
d-i netcfg/get_domain string localdomain

# Mirror / Repository
d-i mirror/country string manual
d-i mirror/http/hostname string debian.biz.net.id
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string 

# Akun User & Root
d-i user-setup/allow-password-weak boolean true
d-i passwd/root-password password toor
d-i passwd/root-password-again password toor
d-i passwd/user-fullname string CarbonOS User
d-i passwd/username string carbon
d-i passwd/user-password password 123
d-i passwd/user-password-again password 123

# Disk & Partisi (Otomatis Gunakan Seluruh Disk)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ===============================================================
# MATIKAN RECOMMENDS (Mencegah Bloatware)
# ===============================================================
d-i base-installer/install-recommends boolean false
d-i pkgsel/install-recommends boolean false

# ===============================================================
# PEMILIHAN PAKET (GNOME Minimal + LightDM + Nemo)
# ===============================================================
tasksel tasksel/first multiselect standard, ssh-server

# ===============================================================
# PEMILIHAN PAKET (Grafik Base + GNOME Minimal + LightDM)
# ===============================================================
tasksel tasksel/first multiselect standard, ssh-server

# Tambahkan paket fondasi Xorg dan LightDM Greeter secara eksplisit
d-i pkgsel/include string \
    curl wget git \
    xserver-xorg-core \
    xserver-xorg-video-all \
    x11-xserver-utils \
    lightdm \
    lightdm-gtk-greeter \
    lightdm-gtk-greeter-settings \
    gnome-session \
    gnome-shell \
    gnome-terminal \
    nemo \
    xwayland \
    xdg-desktop-portal-gnome \
    pipewire \
    wireplumber

d-i pkgsel/upgrade select full-upgrade

# Set LightDM sebagai Display Manager default
d-i shared/default-x-display-manager select lightdm

# ===============================================================
# PERINTAH AKHIR (Set Greeter Default & Target Grafik)
# ===============================================================
d-i preseed/late_command string \
  in-target sh -c 'echo "APT::Install-Recommends \"0\";" > /etc/apt/apt.conf.d/99norecommends' ; \
  in-target sh -c 'echo "APT::Install-Suggests \"0\";" >> /etc/apt/apt.conf.d/99norecommends' ; \
  in-target xdg-mime default nemo.desktop inode/directory application/x-gnome-saved-search ; \
  in-target gsettings set org.nemo.desktop show-desktop-icons false ; \
  in-target sh -c 'echo "[Seat:*]" > /etc/lightdm/lightdm.conf.d/01-custom.conf' ; \
  in-target sh -c 'echo "user-session=gnome" >> /etc/lightdm/lightdm.conf.d/01-custom.conf' ; \
  in-target sh -c 'echo "greeter-session=lightdm-gtk-greeter" >> /etc/lightdm/lightdm.conf.d/01-custom.conf' ; \
  in-target systemctl set-default graphical.target ; \
  in-target systemctl enable lightdm

# Selesai & Reboot
d-i finish-install/reboot_in_progress note
